server:
  port: 8080

spring:
  application:
    name: notification-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # mặc định dev, prod override bằng env var

logging:
  level:
    org.hibernate.orm.connections.pooling: WARN


app:
  async:
    notification:
      core-pool-size: 10
      max-pool-size: 20
      queue-capacity: 500

  retry:
    scheduler-fixed-delay-ms: 10000
    max-retries: 3
    base-delay-seconds: 60

  rate-limit:
    limits:
      email:
        max-count: 5
        window-minutes: 60
        min-interval-seconds: 60
      sms:
        max-count: 3
        window-minutes: 60
        min-interval-seconds: 30
      push:
        max-count: 10
        window-minutes: 60
        min-interval-seconds: 10
      in_app:
        max-count: 3
        window-minutes: 1
        min-interval-seconds: 10