server:
  port: 8080

spring:
  application:
    name: notification-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # mặc định dev, prod override bằng env var

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: VARCHAR # UUID được map thành VARCHAR/CHAR dưới Database MySQL
    show-sql: false

  flyway:
    # Tắt tính năng thay thế biến của Flyway để tránh xung đột với chuỗi template (như ${name}) trong SQL script
    placeholder-replacement: false

logging:
  level:
    org.hibernate.orm.connections.pooling: WARN
    com.project.notificationservice: DEBUG

app:
  sse:
    heartbeat-interval-ms: 15000

  rabbitmq:
    inapp:
      concurrent-consumers: 2
      max-concurrent-consumers: 5

  async:
    notification:
      core-pool-size: 10
      max-pool-size: 20
      queue-capacity: 500

  retry:
    scheduler-fixed-delay-ms: 10000
    max-retries: 3
    base-delay-seconds: 60

  rate-limit:
    limits:
      email:
        max-count: 5
        window-minutes: 60
        min-interval-seconds: 60
      sms:
        max-count: 3
        window-minutes: 60
        min-interval-seconds: 30
      push:
        max-count: 10
        window-minutes: 60
        min-interval-seconds: 10
      in_app:
        max-count: 3
        window-minutes: 1
        min-interval-seconds: 10

    deadlock-retry:
      max-attempts: 3
      initial-delay-ms: 100
      multiplier: 2.0

  scheduling:
    pool-size: 5