server:
  port: 8080

spring:
  application:
    name: notification-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # mặc định dev, prod override bằng env var

logging:
  level:
    org.hibernate.orm.connections.pooling: WARN


app:
  rate-limit:
    limits:
      email:
        max-count: 5
        window-minutes: 60
        min-interval-seconds: 60
      sms:
        max-count: 3
        window-minutes: 60
        min-interval-seconds: 30
      push:
        max-count: 10
        window-minutes: 60
        min-interval-seconds: 10
      in_app:
        max-count: 3
        window-minutes: 1
        min-interval-seconds: 10